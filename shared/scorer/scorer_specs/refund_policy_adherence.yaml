name: refund_policy_adherence
description: "Evaluates whether the agent followed company refund policy when handling refund-related requests."
data_type: Text
primary_model: sfdc_ai__DefaultGPT5
allowed_labels:
  - Followed
  - Violated
  - Inconclusive
fallback_label: Inconclusive
prompt: |
  Analyze the following agent-user conversation and evaluate whether the agent followed the company's refund policy.

  Consider these dimensions:
  1. **Eligibility check**: Did the agent verify whether the customer's request meets refund eligibility criteria (e.g., timeframe, item condition, proof of purchase)?
  2. **Policy adherence**: Did the agent apply the correct refund rules (full vs partial, timeframes, exceptions) without granting unauthorized exceptions or denying valid claims?
  3. **Process correctness**: Did the agent follow required steps (confirmation, documentation, escalation when out of policy)?

  If the conversation does not contain a refund-related request or there is insufficient evidence to judge, use the fallback label.

  Answer with one of the following labels: {!$Input:AllowedLabels}
  or fallback to: {!$Input:FallbackLabel}

  Respond with ONLY the label, then on a new line provide a brief reason for your assessment.

  Conversation Transcript:
  {!$SalesforceDataAction:getSession.chatTranscript}
