name: response_quality_with_tone
description: "Evaluates agent response quality across relevance, clarity, accuracy, helpfulness, and tone"
data_type: Text
primary_model: sfdc_ai__DefaultGPT5
allowed_labels:
  - Excellent
  - Good
  - Adequate
  - Poor
  - Inconclusive
fallback_label: Inconclusive
prompt: |
  Analyze the following agent-user conversation and evaluate the quality of the agent's response.

  Consider these dimensions:
  1. **Relevance**: Did the agent address the user's actual question or request?
  2. **Clarity**: Was the response clear, well-structured, and easy to understand?
  3. **Accuracy**: Did the agent provide correct information (no hallucinations or errors)?
  4. **Helpfulness**: Did the response move the user closer to resolving their issue?
  5. **Tone**: Was the agent's tone appropriate, professional, and matched to the customer's register?

  Answer with one of the following labels: {!$Input:AllowedLabels}
  or fallback to: {!$Input:FallbackLabel}

  Respond with ONLY the label, then on a new line provide a brief reason for your assessment.

  Conversation Transcript:
  {!$SalesforceDataAction:getSession.chatTranscript}
