name: problem_resolution_quality
description: >-
  Classifies how well the agent resolved the customer's problem, leaning on a
  fixed set of quality labels and falling back to a neutral bucket when it
  genuinely cannot tell.

data_type: OpenEnded
lightning_type: lightning__multilineTextType
scorer_type: OpenEnded
semantic_type: Dimension

primary_model: sfdc_ai__DefaultGPT4OmniMini
agent_api_name: API_Automation_Agentforce_Service_Agent

values:
  - Fully_Resolved
  - Partially_Resolved
  - Unresolved
  - Uncertain

fallback_value: Uncertain

prompt: |
  Classify how well the agent resolved the customer's problem in this session.

  Suggested values: {!$Input:AllowedLabels}
  - Fully_Resolved: the customer's problem was completely handled and the customer had no remaining need.
  - Partially_Resolved: the agent made progress but left part of the problem open or unaddressed.
  - Unresolved: the customer's problem was not solved by the end of the session.

  If the transcript is ambiguous, incomplete, or you genuinely cannot judge, fall back to: {!$Input:FallbackLabel}
  Otherwise you may also return any other short value if none of the above fits.

  Session:
  {!$SalesforceDataAction:getSession.chatTranscript}

  Return only the value, then on a new line provide a brief reason.
